name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.x']      # the README promises 3.9 or later
        # Python 3.9 builds are unavailable on the newest Ubuntu image.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run parser and scanner checks
        timeout-minutes: 10
        run: >-
          python -u -X faulthandler -c "import faulthandler, runpy; print('parser checks started', flush=True); faulthandler.dump_traceback_later(60, repeat=True); runpy.run_path('tests/test_parsers.py', run_name='__main__')"
      - run: python tests/test_officer_messaging.py
      - run: python tests/test_officer_routing.py
      - run: python tests/test_owner_actions.py
      - run: python tests/test_officer_controls.py
      - run: python tests/test_officer_fulfillment.py
      - run: python tests/test_deck_log.py
      - run: python tests/test_deck_log_integration.py
      - run: python tests/test_officer_memory.py
      - run: python tests/test_officer_models.py
      - run: python tests/test_officer_instructions.py
      - run: python tests/test_officer_evals.py
      - run: python tests/test_officer_policy.py
      - run: python tests/test_officer_usage.py
      - run: python tests/test_officer_accounting.py
      - run: python tests/test_anthropic_reporting.py
      - run: python tests/test_anthropic_reporting_integration.py
      - run: python tests/test_officer_request.py
      - run: python tests/test_officer_evidence.py
      - run: python tests/test_officer_capabilities.py
      - run: python tests/test_officer_answer_assessment.py
      - run: python tests/test_peer_bridge.py
      - run: python tests/test_shared_bridge.py
      - run: python tests/test_chat_directory.py
      - run: python tests/test_watch_peer.py
      - run: python tests/test_peer_reply_delivery.py
      - run: python tests/test_watch_reply_hook.py
      - run: python tests/test_install_reply_hook.py
      - run: python tests/test_codex_desktop_control.py
      - run: python tests/test_codex_native_input.py
      - run: python tests/test_codex_model_settings.py
      - run: python tests/test_native_observation.py
      - run: python tests/test_claude_native_input.py
      - run: python tests/test_watch_claude_input.py
      - run: python tests/test_claude_mod.py
      - run: python tests/test_claude_peer_backend.py
      - run: python tests/test_claude_global_integration.py
      - run: python tests/test_claude_channel.py
      - run: python tests/test_watch_claude.py
      - run: npm --prefix integrations/claude ci --ignore-scripts --no-audit --no-fund
        if: runner.os != 'Windows'
      - run: npm --prefix integrations/claude test
        if: runner.os != 'Windows'
      - run: python tests/test_claude_integration.py
        if: runner.os != 'Windows'
      - run: python tests/test_peer_integration.py
        if: runner.os != 'Windows'
      - run: python tests/test_claude_peer_integration.py
        if: runner.os != 'Windows'
      - run: python tests/test_peer_reply_integration.py
        if: runner.os != 'Windows'
      - run: npm --prefix integrations/claude-mod test
      - run: node tests/test_claude_mod_page.js
      - run: node tests/test_page.js      # the page's path helpers, outside a browser
      - run: node tests/test_officer_evidence_ui.js
