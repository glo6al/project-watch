name: Windows tail diagnostics
on: [push]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: ${{ matrix.python }}
      - run: python -u tests/test_claude_mod.py
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 3
      - run: python -u tests/test_claude_peer_backend.py
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 3
      - run: python -u tests/test_claude_global_integration.py
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 3
      - run: python -u tests/test_claude_channel.py
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 3
      - run: python -u tests/test_watch_claude.py
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 3
      - run: npm --prefix integrations/claude-mod test
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 3
      - run: node tests/test_claude_mod_page.js
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 3
      - run: node tests/test_page.js
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 3
